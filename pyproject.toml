[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "software-engineering-harness"
version = "0.1.0a2"
description = "A model-agnostic engineering harness that spends intelligence where it matters."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SEH Contributors" }]
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
]

[project.scripts]
seh = "seh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# The product suite is `tests/`. `experiments/` holds frozen Phase 0 evidence and
# is run on demand (`pytest experiments/phase0`), so an experiment can never gate
# the build or inflate the product's test count.
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["seh"]

[tool.coverage.report]
fail_under = 90
show_missing = true
